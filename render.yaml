services:
  - type: worker
    name: plugin-update-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python plugin_checker.py
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
```

